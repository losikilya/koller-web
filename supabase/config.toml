# Local-only Supabase stack. No project link, cloud credentials or provider secrets.
project_id = "dance-platform"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
auto_expose_new_tables = false

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false
sql_paths = []

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000/en/auth/confirm", "http://127.0.0.1:3000/ru/auth/confirm", "http://127.0.0.1:3000/*/auth/callback**", "http://127.0.0.1:4310/en/auth/confirm", "http://127.0.0.1:4310/ru/auth/confirm", "http://127.0.0.1:4310/*/auth/callback**"]
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.email]
enable_signup = true
enable_confirmations = true

[storage]
enabled = false

[realtime]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false
[auth.email.template.confirmation]
subject = "Confirm your Dance Platform email / Подтвердите почту"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your Dance Platform password / Восстановление пароля"
content_path = "./supabase/templates/recovery.html"
